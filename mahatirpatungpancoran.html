<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Star Catcher - 2 Player Duel</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .hud {
      display: flex;
      gap: 50px;
      font-size: 22px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .p1 { color: #38bdf8; }
    .p2 { color: #f43f5e; }
    canvas {
      border: 3px solid #475569;
      background: #020617;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="p1">Player 1 (A/D): <span id="score1">0</span></div>
    <div class="p2">Player 2 (←/→): <span id="score2">0</span></div>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const score1El = document.getElementById('score1');
    score1El.style.fontSize = "22px";
    const score2El = document.getElementById('score2');

    let score1 = 0;
    let score2 = 0;
    let gameOver = false;
    let winnerText = '';

    const p1 = { x: 150, y: 360, width: 60, height: 14, speed: 8, dx: 0, color: '#38bdf8' };
    const p2 = { x: 390, y: 360, width: 60, height: 14, speed: 8, dx: 0, color: '#f43f5e' };
    const items = [];

    function spawnItem() {
      if (gameOver) return;
      const isBomb = Math.random() < 0.25;
      items.push({
        x: Math.random() * (canvas.width - 20) + 10,
        y: -10,
        radius: 8,
        speed: 2.5 + Math.random() * 3,
        type: isBomb ? 'bomb' : 'star'
      });
    }
    setInterval(spawnItem, 450);

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (gameOver && e.key === ' ') restartGame();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function handleInput() {
      p1.dx = 0;
      p2.dx = 0;
      if (keys['a'] || keys['A']) p1.dx = -p1.speed;
      if (keys['d'] || keys['D']) p1.dx = p1.speed;
      if (keys['ArrowLeft']) p2.dx = -p2.speed;
      if (keys['ArrowRight']) p2.dx = p2.speed;
    }

    function checkCollision(player, item) {
      return (
        item.x + item.radius > player.x &&
        item.x - item.radius < player.x + player.width &&
        item.y + item.radius > player.y &&
        item.y - item.radius < player.y + player.height
      );
    }

    function update() {
      if (gameOver) return;
      handleInput();

      p1.x = Math.max(0, Math.min(canvas.width - p1.width, p1.x + p1.dx));
      p2.x = Math.max(0, Math.min(canvas.width - p2.width, p2.x + p2.dx));

      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed;

        if (checkCollision(p1, item)) {
          if (item.type === 'star') score1 += 10;
          else score1 = Math.max(0, score1 - 10);
          score1El.textContent = score1;
          items.splice(i, 1);
          checkWin();
          continue;
        }

        if (checkCollision(p2, item)) {
          if (item.type === 'star') score2 += 10;
          else score2 = Math.max(0, score2 - 10);
          score2El.textContent = score2;
          items.splice(i, 1);
          checkWin();
          continue;
        }

        if (item.y > canvas.height) items.splice(i, 1);
      }
    }

    function checkWin() {
      if (score1 >= 100) { gameOver = true; winnerText = 'Player 1 (Biru) Menang!'; }
      if (score2 >= 100) { gameOver = true; winnerText = 'Player 2 (Merah) Menang!'; }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = p1.color;
      ctx.fillRect(p1.x, p1.y, p1.width, p1.height);

      ctx.fillStyle = p2.color;
      ctx.fillRect(p2.x, p2.y, p2.width, p2.height);

      items.forEach(item => {
        ctx.fillStyle = item.type === 'star' ? '#facc15' : '#ef4444';
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '26px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(winnerText, canvas.width / 2, 180);
        ctx.font = '16px Arial';
        ctx.fillText('Tekan SPASI untuk main lagi', canvas.width / 2, 220);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function restartGame() {
      score1 = 0;
      score2 = 0;
      score1El.textContent = 0;
      score2El.textContent = 0;
      items.length = 0;
      p1.x = 150;
      p2.x = 390;
      gameOver = false;
    }

    loop();
  </script>
</body>
</html>
